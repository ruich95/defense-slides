function next(){if(busy)return;if(step+1<count(slide))return go(slide,step+1);if(slide+1<manifest.length)return go(slide+1,0)}
function previous(){if(busy)return;if(step)return go(slide,step-1);if(slide)return go(slide-1,count(slide-1)-1)}
function resize(){const v=$('viewport');$('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(v.clientWidth/1600,v.clientHeight/900)})`;const api=instances.get(slide);if(api&&api.resize)api.resize()}
function notes(){const open=$('notes-dialog').classList.toggle('open');$('notes').setAttribute('aria-expanded',String(open))}
async function fullscreen(){if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}
$('stage').addEventListener('click',()=>{if(!getSelection().toString())next()});$('previous').onclick=previous;$('next').onclick=next;$('restart').onclick=()=>go(0,0,false);$('notes').onclick=notes;$('fullscreen').onclick=fullscreen;$('close-notes').onclick=()=>{$('notes-dialog').classList.remove('open');$('notes').setAttribute('aria-expanded','false')};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.target.tagName==='BUTTON'&&e.code==='Space'&&!document.fullscreenElement)return;if(['Space','ArrowRight','PageDown'].includes(e.code)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.code)){e.preventDefault();previous()}else if(e.code==='Home')go(0,0,false);else if(e.code==='End')go(manifest.length-1,count(manifest.length-1)-1,false);else if(e.key.toLowerCase()==='r')go(slide,0,false);else if(e.key.toLowerCase()==='f')fullscreen();else if(e.key.toLowerCase()==='s')notes();else if(e.key==='Escape')$('notes-dialog').classList.remove('open')});
window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('full',!!document.fullscreenElement);resize()});
window.defenseDeck={go,next,previous,manifest,getState:()=>({slide,step,busy,slides:manifest.length,steps:count(slide)})};
if(manifest.length===1&&manifest[0].id==='page2')window.defenseSlide={go:(s,a=true)=>go(0,s,a),next,previous,getState:()=>({step,busy,count:count(0)}),get states(){return controller(0).states}};
function fromHash(){const hash=location.hash.match(/^#(\d+)(?:\.(\d+))?$/),single=manifest.length===1&&count(0)>1;return go(hash&&!single?+hash[1]-1:0,hash?(single?+hash[1]-1:+(hash[2]||1)-1):0,false)}
window.addEventListener('hashchange',fromHash);resize();fromHash();
})();
</script>
